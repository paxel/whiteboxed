# cargo-deny: run in CI by the Security workflow. See docs/security-audit.md.

[graph]
all-features = true

[advisories]
# Known vulnerabilities always fail. Unmaintained notices fail for direct
# dependencies only; transitive ones are reviewed in the security audit.
unmaintained = "workspace"
ignore = [
    # ttf-parser is unmaintained; whiteboxed uses it only to measure text widths of
    # its own embedded font, and resvg/fontdb depend on it too. Replace when resvg
    # moves on (tracked in docs/security-audit.md).
    { id = "RUSTSEC-2026-0192", reason = "only reads the embedded font; no untrusted fonts" },
]

[licenses]
confidence-threshold = 0.9
# Every crate must be available under one of these. Copyleft licences in the tree
# (GPL-2.0, LGPL-2.1) only appear as alternatives to MIT/Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
# GUI stacks pull several versions of the same crate; that is a size issue, not a
# security one.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
