# Renders the README screenshots on demand: `gh workflow run screenshots.yml`, then
# `gh run download <run-id> -n screenshots -D docs/screenshots`. The window is drawn
# headlessly with software Vulkan (lavapipe), the same way the render tests run.
name: Screenshots

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  screenshots:
    name: Render docs/screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Render
        run: cargo test --features render-tests --test render doc_screenshot -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
