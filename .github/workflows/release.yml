# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate           — tag matches the crate version, then the full Linux gate
#   build-linux    — binary tar.gz (x86_64)
#   build-windows  — zip with whiteboxed.exe (x86_64)
#   build-macos    — binary tar.gz, per arch (arm64, x86_64)
#   release        — GitHub Release, notes = the CHANGELOG section for the tag
#   publish-crate  — crates.io
#
# One-time setup (repository secret):
#   CARGO_REGISTRY_TOKEN — crates.io API token (publish scope)
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (Linux, full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build-linux:
    name: Linux artifacts
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Binary tarball
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist
          tar -C target/release -czf "dist/whiteboxed-${ver}-linux-x86_64.tar.gz" whiteboxed
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  build-windows:
    name: Windows artifacts
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/whiteboxed.exe, LICENSE `
                           -DestinationPath "dist/whiteboxed-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS artifacts (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # The last Intel image GitHub offers (this label lives until 2027-08).
          # When it goes, switch the x86_64 artifact to a cross-compile from
          # the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Binary tarball
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist
          tar -C target/release -czf "dist/whiteboxed-${ver}-macos-${{ matrix.arch }}.tar.gz" whiteboxed
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "whiteboxed $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "whiteboxed $GITHUB_REF_NAME" \
              --notes-file notes.md \
              dist/*
          fi

  publish-crate:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
