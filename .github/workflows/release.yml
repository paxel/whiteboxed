# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate           — tag matches the crate version, then the full Linux gate
#   build-linux    — tar.gz (x86_64): binary, launcher entry, icons, install-icon.sh
#   build-windows  — zip with whiteboxed.exe (x86_64)
#   build-macos    — binary tar.gz, per arch (arm64, x86_64)
#   release        — GitHub Release, notes = the CHANGELOG section for the tag
#   publish-crate  — crates.io
#   channels       — Homebrew formula + Scoop manifest pushed to the tap/bucket
#
# One-time setup (repository secrets):
#   CARGO_REGISTRY_TOKEN — crates.io API token (publish scope)
#   CHANNEL_PAT          — PAT with push access to paxel/homebrew-tap and
#                          paxel/scoop-bucket
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (Linux, full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System dependencies (software Vulkan for the render tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit,cargo-deny
      - name: No known vulnerabilities, allowed licences only
        run: |
          cargo audit
          cargo deny check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features render-tests

  build-linux:
    name: Linux artifacts
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        run: cargo build --release
      - name: Tarball (flat, as the Homebrew formula expects)
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist bundle
          cp target/release/whiteboxed LICENSE bundle/
          cp packaging/linux/io.github.paxel.whiteboxed.desktop packaging/linux/install-icon.sh bundle/
          cp assets/icon_256.png assets/icon.svg bundle/
          tar -C bundle -czf "dist/whiteboxed-${ver}-linux-x86_64.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: dist/*

  build-windows:
    name: Windows artifacts
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        run: cargo build --release
      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/whiteboxed.exe, LICENSE `
                           -DestinationPath "dist/whiteboxed-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS artifacts (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # The last Intel image GitHub offers (this label lives until 2027-08).
          # When it goes, switch the x86_64 artifact to a cross-compile from
          # the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        run: cargo build --release
      - name: Binary tarball
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist
          tar -C target/release -czf "dist/whiteboxed-${ver}-macos-${{ matrix.arch }}.tar.gz" whiteboxed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "whiteboxed $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "whiteboxed $GITHUB_REF_NAME" \
              --notes-file notes.md \
              dist/*
          fi

  publish-crate:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
        with:
          toolchain: stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  channels:
    name: Homebrew tap + Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Render formula and manifest from the templates
        run: |
          ver=${GITHUB_REF_NAME#v}
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          mkdir -p out
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha whiteboxed-$ver-macos-arm64.tar.gz)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha whiteboxed-$ver-macos-x86_64.tar.gz)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha whiteboxed-$ver-linux-x86_64.tar.gz)/" \
              packaging/homebrew/whiteboxed.rb.tmpl > out/whiteboxed.rb
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_WINDOWS_X86_64}}/$(sha whiteboxed-$ver-windows-x86_64.zip)/" \
              packaging/scoop/whiteboxed.json.tmpl > out/whiteboxed.json
          ! grep -n "{{" out/whiteboxed.rb out/whiteboxed.json
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          git config --global user.name "whiteboxed-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/whiteboxed.rb tap/Formula/whiteboxed.rb
          git -C tap add Formula/whiteboxed.rb
          git -C tap commit -m "whiteboxed $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/whiteboxed.json bucket/bucket/whiteboxed.json
          git -C bucket add bucket/whiteboxed.json
          git -C bucket commit -m "whiteboxed $ver"
          git -C bucket push
