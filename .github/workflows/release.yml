# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate           — paxel/gates release-gate.yml: no open alert or SonarQube Cloud finding
#                    that is not accepted, no known vulnerability, no licence outside the
#                    allowlist, and a CHANGELOG section for the version
#   test           — tag matches the crate version, then format, clippy and every test on
#                    the tagged commit, render tests included (lavapipe)
#   build-linux    — tar.gz (x86_64): binary, launcher entry, icons, install-icon.sh
#   build-windows  — zip with whiteboxed.exe (x86_64)
#   build-macos    — binary tar.gz, per arch (arm64, x86_64)
#   crate          — the .crate file `cargo publish` uploads later
#   provenance     — paxel/gates provenance.yml: a CycloneDX SBOM of the source, signed build
#                    provenance for every file and its Sigstore bundle as a file of its own
#   release        — GitHub Release, notes = the CHANGELOG section for the tag, every file
#                    of the jobs before
#   publish-crate  — crates.io, last, because a published crate cannot be taken back
#   channels       — Homebrew formula + Scoop manifest pushed to the tap/bucket
#
# One-time setup (repository secrets):
#   GATES_ALERTS_TOKEN   — fine-grained token, Secret scanning alerts: read (release gate)
#   CARGO_REGISTRY_TOKEN — crates.io API token (publish scope)
#   CHANNEL_PAT          — PAT with push access to paxel/homebrew-tap and
#                          paxel/scoop-bucket
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: the job that writes the GitHub Release widens this itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  # The shared gate runs no tests. A tag can sit on any commit, so the tagged one is tested
  # here once more before anything is built from it (docs/adr/0001-move-to-gates.md).
  test:
    name: Tests on the tagged commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - name: System dependencies (software Vulkan for the render tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --check
      # The two clippy runs of the shared Rust gate: shipped code under the whole lint set,
      # tests with the lints allowed that are how a test fails.
      - name: Clippy on shipped code
        run: cargo clippy --locked --all-features -- -D warnings
      - name: Clippy on tests
        run: >-
          cargo clippy --locked --tests --benches --examples --all-features -- -D warnings
          -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic -A clippy::indexing_slicing
          -A clippy::string_slice -A clippy::arithmetic_side_effects -A clippy::unreachable
      - name: Tests (with render tests)
        run: cargo test --locked --all-features

  build-linux:
    name: Linux artifacts
    needs: [gate, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --locked --release
      - name: Tarball (flat, as the Homebrew formula expects)
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist bundle
          cp target/release/whiteboxed LICENSE bundle/
          cp packaging/linux/io.github.paxel.whiteboxed.desktop packaging/linux/install-icon.sh bundle/
          cp assets/icon_256.png assets/icon.svg bundle/
          tar -C bundle -czf "dist/whiteboxed-${ver}-linux-x86_64.tar.gz" .
      # dist-*: the artifacts the provenance job collects.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-x86_64
          path: dist/*

  build-windows:
    name: Windows artifacts
    needs: [gate, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --locked --release
      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/whiteboxed.exe, LICENSE `
                           -DestinationPath "dist/whiteboxed-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-x86_64
          path: dist/*

  build-macos:
    name: macOS artifacts (${{ matrix.arch }})
    needs: [gate, test]
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # The last Intel image GitHub offers (this label lives until 2027-08).
          # When it goes, switch the x86_64 artifact to a cross-compile from
          # the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --locked --release
      - name: Binary tarball
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist
          tar -C target/release -czf "dist/whiteboxed-${ver}-macos-${{ matrix.arch }}.tar.gz" whiteboxed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*

  # The crate as `cargo publish` uploads it, so it is attested and on the release too (the
  # standard's Q8). publish-crate packages the same tagged sources again.
  crate:
    name: Crate file
    needs: [gate, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Package
        run: |
          cargo package --locked
          mkdir -p dist
          cp "target/package/whiteboxed-${GITHUB_REF_NAME#v}.crate" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-crate
          path: dist/*

  # A CycloneDX SBOM of the source, signed build provenance for every file and the Sigstore
  # bundle as a file of its own, for verification without GitHub's API.
  provenance:
    needs: [build-linux, build-windows, build-macos, crate]
    uses: paxel/gates/.github/workflows/provenance.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: whiteboxed
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  release:
    name: GitHub Release
    needs: provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every file of the build jobs, with the SBOM and the Sigstore bundle beside them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "whiteboxed $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --target "$GITHUB_SHA" \
              --title "whiteboxed $GITHUB_REF_NAME" \
              --notes-file notes.md \
              dist/*
          fi

  publish-crate:
    name: crates.io
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  channels:
    name: Homebrew tap + Scoop bucket
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render formula and manifest from the templates
        run: |
          ver=${GITHUB_REF_NAME#v}
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          mkdir -p out
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha whiteboxed-$ver-macos-arm64.tar.gz)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha whiteboxed-$ver-macos-x86_64.tar.gz)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha whiteboxed-$ver-linux-x86_64.tar.gz)/" \
              packaging/homebrew/whiteboxed.rb.tmpl > out/whiteboxed.rb
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_WINDOWS_X86_64}}/$(sha whiteboxed-$ver-windows-x86_64.zip)/" \
              packaging/scoop/whiteboxed.json.tmpl > out/whiteboxed.json
          ! grep -n "{{" out/whiteboxed.rb out/whiteboxed.json
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          git config --global user.name "whiteboxed-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/whiteboxed.rb tap/Formula/whiteboxed.rb
          git -C tap add Formula/whiteboxed.rb
          git -C tap commit -m "whiteboxed $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/whiteboxed.json bucket/bucket/whiteboxed.json
          git -C bucket add bucket/whiteboxed.json
          git -C bucket commit -m "whiteboxed $ver"
          git -C bucket push
