name: CI

# whiteboxed's gates. The standard's part comes from paxel/gates: the OSV gate, the Rust gate
# on Linux x86_64 (format, lint set, clippy, tests with the render tests on software Vulkan,
# coverage ratchet) and SonarQube Cloud. The Rust gate tests on Linux only, so the Windows and
# macOS lanes, which build and run every test there, are whiteboxed's own
# (docs/adr/0001-move-to-gates.md).
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1

  rust:
    uses: paxel/gates/.github/workflows/rust.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    with:
      # Software Vulkan (lavapipe), so the render tests can draw the window headlessly.
      apt-packages: mesa-vulkan-drivers libvulkan1

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (build + tests)
            runner: windows-latest
          - name: macOS (build + tests)
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked
      # Without the render tests: these runners have no Vulkan device.
      - name: Tests
        run: cargo test --locked

  sonar:
    needs: rust
    uses: paxel/gates/.github/workflows/sonar.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
