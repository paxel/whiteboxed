[package]
name = "whiteboxed"
version = "0.1.0"
edition = "2024"
description = "WYSIWYG editor for arc42 building-block views"
license = "MIT"
repository = "https://github.com/paxel/whiteboxed"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
base64 = "0.22"
directories = "6"
eframe = "0.35"
egui = "0.35"
epaint_default_fonts = "0.35"
resvg = { version = "0.48", default-features = false, features = ["text"] }
rfd = "0.17"
rmcp = { version = "3.5", features = ["server", "transport-streamable-http-server", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-util = "0.7"
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[features]
# Tests that render the window through wgpu; they need a Vulkan/Metal/DX12 device
# (CI uses lavapipe on Linux).
render-tests = []
